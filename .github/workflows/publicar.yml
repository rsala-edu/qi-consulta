# Proves i publicació a GitHub Pages a cada push a main.
# Si alguna prova falla, no es publica.
name: Proves i publicació

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proves:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipus
        run: npm run typecheck
      - name: Proves unitàries
        run: npm test
      - name: Navegador per a Playwright
        run: npx playwright install --with-deps chromium
      - name: Proves del flux complet
        run: npm run test:e2e
      - name: Informe de Playwright (si falla)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  compilar:
    needs: proves
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # SHA-256 dels correus que poden entrar, separats per comes (variable
          # del repositori; mai els correus en clar)
          VITE_HASHOS_CORREUS_PERMESOS: ${{ vars.HASHOS_CORREUS_PERMESOS }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.desplegament.outputs.page_url }}
    steps:
      - id: desplegament
        uses: actions/deploy-pages@v5
