# «Publicar»: el que bloqueja el desplegament a GitHub Pages. Ha de ser curt
# (objectiu: 5 minuts o menys). Lint, tipus, proves unitàries, una tanda curta
# d'E2E essencials (les marcades @essencial i les del build de producció) i el
# build. Totes les E2E són al workflow «Proves completes» (proves.yml), que no
# bloqueja.
#
# Res d'instal·lar navegadors: el job corre dins la imatge oficial de
# Playwright, que ja els porta (ha de ser la mateixa versió que package.json).
name: Publicar

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprovar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipus
        run: npm run typecheck
      - name: Proves unitàries
        run: npm test
      - name: E2E essencials
        run: npx playwright test --project=escriptori --grep @essencial
      - name: E2E amb el build de producció
        run: npm run test:e2e:produccio
      - name: Build per a GitHub Pages
        run: npm run build
        env:
          # SHA-256 dels correus que poden entrar, separats per comes (variable
          # del repositori; mai els correus en clar)
          VITE_HASHOS_CORREUS_PERMESOS: ${{ vars.HASHOS_CORREUS_PERMESOS }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Informe de Playwright (si falla)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-publicar
          path: |
            playwright-report
            test-results
          retention-days: 7

  desplegar:
    needs: comprovar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.desplegament.outputs.page_url }}
    steps:
      - id: desplegament
        uses: actions/deploy-pages@v5
